<style>
:root{
  --bg:#EAE4D8; --surface:#F2EEE7; --ink:#21342E; --muted:#345147; --line:#D7D1C6;
  --plum:#1D372F; --purple:#3A564B; --purple-soft:#E6E1D5; --orange:#B79A70; --orange-ink:#806F55;
  --good:#193B31; --bad:#695E4A;
  --display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.5;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 64px}
.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:999px;background:var(--orange);color:var(--ink);font-weight:700;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:#F2EEE7;font-weight:600;transition:background-color .15s,border-color .15s}
.btn:hover{border-color:var(--purple)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#F2EEE7}
.btn.primary:hover{background:#1C3E34}
.btn.ok{background:var(--good);border-color:var(--good);color:#F2EEE7}
.btn.no{border-color:var(--bad);color:var(--bad);background:#F2EEE7}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:15px}
.in{min-height:44px;padding:0 12px;border:1.5px solid #C5C6BA;border-radius:10px;background:#F2EEE7;width:100%;min-width:0}
.in:focus{outline:3px solid rgba(183,154,112,.55);outline-offset:0;border-color:var(--purple)}
textarea.in{min-height:90px;padding:10px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 14px 40px -28px rgba(29,55,47,.5)}
.topbar{background:linear-gradient(135deg,var(--plum) 0%,#1B3A30 100%);color:#F2EEE7;margin:0 -20px 24px;padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;border-radius:0 0 18px 18px;box-shadow:0 8px 24px -12px rgba(29,55,47,.5)}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.who .muted{color:#D7D2C7}
.logo{display:block;width:72px;height:auto}
.brand{font-family:var(--display);font-weight:800;font-size:24px}
.topbar .btn{background:transparent;border-color:rgba(242,238,231,.45);color:#F2EEE7}
.topbar .btn:hover{border-color:#F2EEE7}
.tabs{display:flex;gap:6px;margin-bottom:24px;background:var(--purple-soft);padding:5px;border-radius:14px;overflow-x:auto;scrollbar-width:thin}
.tab{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:transparent;font-weight:600;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--purple);color:#F2EEE7}
.seg{display:flex;gap:6px;background:var(--purple-soft);padding:5px;border-radius:14px}
.seg .tab{flex:1}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:30px;line-height:1.4;font-variant-numeric:tabular-nums;color:var(--plum)}
.kpi span{color:var(--muted);font-size:15px}
.kpi.highlight{border-top-color:var(--purple);background:linear-gradient(180deg,#F2EEE7 60%,#EAE4D8)}
.summary-bar{display:flex;flex-wrap:wrap;gap:12px 24px;padding:14px 18px;background:var(--purple-soft);border:1px solid var(--line);border-radius:12px;margin-top:12px;font-size:14.5px;font-variant-numeric:tabular-nums}
.summary-bar strong{color:var(--plum);font-weight:700}
.summary-bar .sep{width:1px;background:var(--line);align-self:stretch;margin:0 4px}
.tbl-footer td{background:#EAE4D8;font-weight:700;border-top:2px solid var(--plum)!important;font-variant-numeric:tabular-nums}
.export-info{font-size:13px;color:var(--muted);margin-top:6px}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.bar{height:12px;border-radius:6px;background:var(--purple-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--purple);border-radius:6px}
.bar.o i{background:var(--orange)}
.row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.row .l{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:14px}
.search{flex:1 1 260px;max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#F2EEE7;font-weight:600;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#F2EEE7}
.count{color:var(--muted);font-size:15px;margin-inline-start:auto}
.scroll{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;font-size:15px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:1;text-align:start;padding:12px;background:var(--purple-soft);font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:#F2EEE7}
td .in{min-height:40px;min-width:100px}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:600;background:var(--purple-soft);color:var(--purple);white-space:nowrap}
.st.done{background:#DBD8CC;color:var(--good)}
.st.bad{background:#DBCEB9;color:var(--bad)}
.st.new{background:#E2D8C7;color:var(--orange-ink)}
.msg{border-radius:12px;padding:12px 16px;font-size:15px;margin-bottom:20px;border:1px solid var(--line);background:#F2EEE7}
.msg.err{border-color:var(--bad);color:var(--bad);font-weight:600;background:#F2EEE7}
.msg.ok{border-color:var(--good);color:var(--good);font-weight:600;background:#DBD8CC}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.center .card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
.center .logo{width:96px}
.addgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.yes{color:var(--good);font-weight:700}.nope{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.nm{display:flex;gap:6px;align-items:center}.nm .in{min-width:130px}
[hidden]{display:none!important}
@media (max-width:640px){.wrap{padding:0 14px 56px}.topbar{margin:0 -14px 18px;padding:12px 14px}.card{padding:18px}.logo{width:60px}.count{margin-inline-start:0;width:100%}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

      var words=par.split(/\s+/).filter(Boolean),line="";
      if(!words.length){out.push("");return;}
      words.forEach(function(w){var t=line?line+" "+w:w;if(line&&ctx.measureText(t).width>maxW){out.push(line);line=w;}else line=t;});
      out.push(line);
    });

  }
  function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function money(n){return Number(n||0).toLocaleString("en-US")+" ج.م";}
  /* paints the content; returns the y where content ends */
  function paint(ctx,o,logo,H){
    ctx.direction="rtl";ctx.textAlign="right";ctx.textBaseline="alphabetic";
    ctx.fillStyle="#F2EEE7";ctx.fillRect(0,0,W,H);
    var g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,"#1D372F");g.addColorStop(1,"#193B31");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,220);

    ctx.fillStyle="#B79A70";ctx.font="800 60px "+HEAD;ctx.fillText("#"+o.id,PAD,110);
    ctx.fillStyle="#E2DCD1";ctx.font="500 24px "+BODY;ctx.fillText(o.date||"",PAD,156);
    ctx.direction="rtl";ctx.textAlign="right";
    var y=262;
    /* status pill */
    ctx.font="700 26px "+BODY;
    var sw=ctx.measureText(o.status||"").width+48;
    ctx.fillStyle=o.status==="مكتمل"?"#DBD8CC":o.status==="مرفوض"?"#DBCEB9":"#E2D8C7";rr(ctx,W-PAD-sw,y,sw,52,26);ctx.fill();
    ctx.fillStyle=o.status==="مكتمل"?"#193B31":o.status==="مرفوض"?"#695E4A":"#806F55";ctx.textAlign="center";ctx.fillText(o.status||"",W-PAD-sw/2,y+36);ctx.textAlign="right";
    y+=52+24;
    /* rows */
    var maxW=W-2*PAD-LW;
    o.rows.forEach(function(r,i){
      ctx.font="600 30px "+BODY;
      var lines=wrap(ctx,r[1]||"-",maxW),h=Math.max(1,lines.length)*46+30;
      if(i%2===0){ctx.fillStyle="#EAE4D8";ctx.fillRect(PAD-16,y,W-2*PAD+32,h);}
      ctx.fillStyle="#345147";ctx.font="600 24px "+BODY;ctx.fillText(r[0],W-PAD,y+h/2+9);
      ctx.fillStyle="#21342E";ctx.font="600 30px "+BODY;
      if(r[2]){ctx.direction="ltr";}
      lines.forEach(function(l,k){ctx.fillText(l,W-PAD-LW,y+48+k*46);});

      y+=h;

    ctx.fillStyle="#345147";ctx.font="600 24px "+BODY;ctx.fillText("نسبة الإنجاز",W-PAD,y+44);
    var bx=PAD+110,bw=maxW-110,by=y+24;
    ctx.fillStyle="#E6E1D5";rr(ctx,bx,by,bw,26,13);ctx.fill();
    var pg=Math.max(0,Math.min(100,Number(o.progress)||0));
    if(pg>0){ctx.fillStyle="#3A564B";rr(ctx,bx+bw-bw*pg/100,by,Math.max(26,bw*pg/100),26,13);ctx.fill();}
    ctx.fillStyle="#21342E";ctx.font="700 28px "+BODY;ctx.textAlign="left";ctx.direction="ltr";ctx.fillText(pg+"%",PAD,y+46);ctx.textAlign="right";ctx.direction="rtl";
    y+=84;
    /* finance */
    if(o.fin){
      ctx.fillStyle="#F2EEE7";rr(ctx,PAD-16,y,W-2*PAD+32,150,18);ctx.fill();ctx.strokeStyle="#D7D1C6";ctx.lineWidth=2;ctx.stroke();

      });

    }
    /* note */
    if(o.note){
      ctx.font="600 28px "+BODY;

      ctx.fillStyle="#E4DBCC";rr(ctx,PAD-16,y,W-2*PAD+32,nh,18);ctx.fill();

      nl.forEach(function(l,k){ctx.fillText(l,W-PAD-12,y+84+k*44);});

    }

  function draw(o,logo){

    return c;
  }
  /* minimal one-page PDF that embeds the card JPEG */
  function pdf(jpeg,w,h){
    var enc=new TextEncoder(),chunks=[],len=0,offs=[];
    function add(x){var b=typeof x==="string"?enc.encode(x):x;chunks.push(b);len+=b.length;}
    var PW=595.28,PH=Math.round(PW*h/w*100)/100;
    add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
    function obj(n,body){offs[n]=len;add(n+" 0 obj\n"+body+"\nendobj\n");}
    obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
    obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
    obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
    offs[4]=len;add("4 0 obj\n<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpeg.length+" >>\nstream\n");add(jpeg);add("\nendstream\nendobj\n");
    var cs="q "+PW+" 0 0 "+PH+" 0 0 cm /Im0 Do Q";
    obj(5,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
    var xo=len;
    add("xref\n0 6\n0000000000 65535 f \n");
    for(var i=1;i<=5;i++)add(("0000000000"+offs[i]).slice(-10)+" 00000 n \n");
    add("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xo+"\n%%EOF\n");
    var out=new Uint8Array(len),p=0;chunks.forEach(function(b){out.set(b,p);p+=b.length;});
    return out;
  }
  function jpegBytes(canvas){
    var b=atob(canvas.toDataURL("image/jpeg",0.92).split(",")[1]),u=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;
  }
  return {draw:draw,pdf:pdf,jpegBytes:jpegBytes};
})();

/* ---------- Search, filters, export ---------- */
function normQ(v){return String(v==null?"":v).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);}).toLowerCase();}
function hit(o,fields,q){if(!q)return true;var t=normQ(fields.map(function(f){return o[f];}).join(" "));return q.split(/\s+/).every(function(w){return t.indexOf(w)>=0;});}
function reqFiltered(){var q=normQ(S.q).trim();return S.requests.filter(function(r){return (!S.fs||r.status===S.fs)&&hit(r,["customer_name","phone","business_name","work_type","work_location","details"],q);});}
function jobFiltered(){var q=normQ(S.jq).trim();return S.jobapps.filter(function(j){return (!S.jfs||j.status===S.jfs)&&hit(j,["full_name","phone","email","governorate","desired_job","last_workplace","details"],q);});}
function toolbarView(kind){
  var req=kind==="req",list=req?STATUSES:JOB_STATUSES,cur=req?S.fs:S.jfs,q=req?S.q:S.jq,ceo=S.profile.role==="ceo",src=req?S.requests:S.jobapps;
  var cnt=function(st){return src.filter(function(x){return x.status===st;}).length;};
  var h='<div class="toolbar"><input class="in search" type="search" id="srch" data-k="'+kind+'" placeholder="بحث بالاسم أو الرقم أو النشاط..." value="'+esc(q)+'" aria-label="بحث"><div class="chips">'+
    '<button class="chip" type="button" data-act="fs" data-k="'+kind+'" data-v="" aria-pressed="'+(cur==="")+'">الكل ('+src.length+')</button>';
  list.forEach(function(s){h+='<button class="chip" type="button" data-act="fs" data-k="'+kind+'" data-v="'+esc(s)+'" aria-pressed="'+(cur===s)+'">'+esc(s)+' ('+cnt(s)+')</button>';});
  h+='</div>';
  if(!ceo&&req)h+='<div class="xp"><button class="btn sm primary" type="button" data-act="xls">⬇ تصدير Excel (المعروض)</button></div>';
  if(ceo){
    h+='<div class="xp"><select class="in" data-f="xr" aria-label="فترة التقرير">'+
      [["all","كل الفترات"],["month","هذا الشهر"],["30","آخر 30 يوم"],["custom","فترة مخصصة"]].map(function(o){return '<option value="'+o[0]+'"'+(S.xr===o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("")+'</select>';
    if(S.xr==="custom")h+='<input class="in" type="date" data-f="xf" value="'+esc(S.xf)+'" aria-label="من تاريخ"><input class="in" type="date" data-f="xt" value="'+esc(S.xt)+'" aria-label="إلى تاريخ">';
    h+='<button class="btn sm primary" type="button" data-act="xls"'+(S.xbusy?" disabled":"")+'>'+(S.xbusy?"جاري التجهيز...":"⬇ تقرير Excel كامل")+'</button></div>';
  }
  return h+'</div>';
}
function dayStr(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function periodInfo(){
  var now=new Date(),from=null,to=null,label="كل الفترات";
  if(S.xr==="month"){from=new Date(now.getFullYear(),now.getMonth(),1);label="هذا الشهر";}
  else if(S.xr==="30"){from=new Date(now.getTime()-30*864e5);label="آخر 30 يوم";}
  else if(S.xr==="custom"){
    if(S.xf)from=new Date(S.xf+"T00:00:00");
    if(S.xt)to=new Date(S.xt+"T23:59:59");
    label="من "+(S.xf||"البداية")+" إلى "+(S.xt||"اليوم");
  }
  return {from:from,to:to,label:label};
}
function inPeriod(iso,p){
  if(!p.from&&!p.to)return true;
  var t=new Date(iso).getTime();if(isNaN(t))return false;
  return (!p.from||t>=p.from.getTime())&&(!p.to||t<=p.to.getTime());
}
function exportLite(){
  if(typeof MzXlsx==="undefined"||!MzXlsx.lite){setMsg("err","وحدة التصدير غير متاحة. حدّث الصفحة.");render();return;}
  var today=dayStr(new Date()),isA=S.profile.role==="assistant_manager",bytes,n,fname;
  try{
    if(isA){n=S.tasks.length;bytes=MzXlsx.lite({kind:"assistant",tasks:S.tasks});fname="fnbora-my-tasks-"+today+".xlsx";}
    else{var L=reqFiltered();n=L.length;bytes=MzXlsx.lite({kind:"manager",requests:L});fname="fnbora-requests-"+today+".xlsx";}
    saveBlob(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),fname);
    setMsg("ok","تم تجهيز الملف ("+fname+") — "+n+(isA?" مهمة.":" طلب (المعروض حاليًا)."));
  }catch(e){setMsg("err","حصلت مشكلة في تجهيز الملف. جرّب تاني.");}
  render();
}
function exportExcel(){
  if(S.profile.role!=="ceo")return exportLite();
  if(typeof MzXlsx==="undefined"){setMsg("err","وحدة التصدير غير متاحة. حدّث الصفحة.");render();return;}
  S.xbusy=true;setMsg(null);render();
  Promise.all([rpc("manager_list_requests"),rpc("ceo_list_job_applications")]).then(function(r){
    var p=periodInfo(),R=(r[0]||[]).filter(function(x){return inPeriod(x.created_at,p);}),J=(r[1]||[]).filter(function(x){return inPeriod(x.created_at,p);});
    var today=dayStr(new Date());
    var bytes=MzXlsx.build({requests:R,jobs:J,statuses:STATUSES,generated:today,period:p.label});
    var blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var fname="fnbora-report-"+today+".xlsx";
    saveBlob(blob,fname);
    setMsg("ok","تم تجهيز التقرير ("+fname+") — "+R.length+" طلب عميل و"+J.length+" طلب توظيف.");
  }).catch(function(e){setMsg("err",arErr(e));}).then(function(){S.xbusy=false;render();});
}
function saveBlob(blob,name){
  var a=document.createElement("a"),u=URL.createObjectURL(blob);
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},4000);
}

function closeCard(){var ov=document.getElementById("cardModal");if(ov)ov.remove();document.body.style.overflow="";}
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("[data-c]");
  if(!t){if(e.target.id==="cardModal")closeCard();return;}
  var a=t.getAttribute("data-c");
  if(a==="close")closeCard();
  if(a==="pdf"||a==="img"){var f=cardFile(a==="pdf"?"pdf":"img");saveBlob(f,f.name);cardNote("ok","تم تحميل الملف: "+f.name);}
  if(a==="share"){
    var f=cardFile("pdf");
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:"طلب رقم "+CARD.id+" - Fnbora"}).then(function(){cardNote("ok","تمت المشاركة.");},function(er){if(er&&er.name!=="AbortError")cardNote("err","تعذّرت المشاركة. حمّل الملف وابعته يدويًا.");});
    }else{
      saveBlob(f,f.name);cardNote("ok","اتحمّل الملف. افتح واتساب وابعته في المحادثة (جهازك مش بيدعم المشاركة المباشرة).");
    }
  }
});
document.addEventListener("input",function(e){
  var t=e.target;if(!t||!document.getElementById("cardModal"))return;
  if(t.id==="cNote"){CARD.note=t.value;cardRepaint();}
});
document.addEventListener("change",function(e){
  var t=e.target;if(!t||!document.getElementById("cardModal"))return;
  if(t.id==="cCust"){CARD.cust=t.checked;cardRepaint();}
  if(t.id==="cFin"){CARD.fin=t.checked;cardRepaint();}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeCard();closeFile();}});

/* ---------- Request file (notes / follow-up / payments) ---------- */
var FM={id:null,notes:[],pays:[],note:null};
function fmReq(){return S.requests.filter(function(x){return x.id===FM.id;})[0];}
function fmMsg(type,t){FM.note=t?{type:type,text:t}:null;}
function openFile(id){
  FM.id=id;FM.notes=[];FM.pays=[];FM.note=null;
  var ov=document.getElementById("fileModal");
  if(!ov){ov=document.createElement("div");ov.id="fileModal";document.body.appendChild(ov);}
  ov.className="modal";document.body.style.overflow="hidden";
  paintFile();fmReload();
}
function closeFile(){var ov=document.getElementById("fileModal");if(ov)ov.remove();document.body.style.overflow="";}
function fmReload(){
  var ceo=S.profile.role==="ceo",jobs=[rpc("manager_list_notes",{p_request_id:FM.id}).then(function(d){FM.notes=d||[];})];
  if(ceo)jobs.push(rpc("ceo_list_payments",{p_request_id:FM.id}).then(function(d){FM.pays=d||[];}));
  return Promise.all(jobs).catch(function(e){fmMsg("err",arErr(e));}).then(paintFile);
}
function fmRefreshList(){return rpc("manager_list_requests").then(function(d){S.requests=d||[];render();}).catch(function(){});}
function fmDo(p,ok){
  return p.then(function(){fmMsg("ok",ok);},function(e){fmMsg("err",arErr(e));}).then(function(){return Promise.all([fmReload(),fmRefreshList()]);});
}
function paintFile(){
  var ov=document.getElementById("fileModal"),r=fmReq();if(!ov||!r)return;
  var ceo=S.profile.role==="ceo",v=Number(r.value||0),c=Number(r.collected||0);
  var h='<div class="mbox" role="dialog" aria-modal="true" aria-label="ملف الطلب"><div class="mhead"><h2>ملف الطلب #'+r.id+' — '+esc(r.customer_name)+'</h2><button class="btn sm" type="button" data-m="close">إغلاق</button></div>';
  if(FM.note)h+='<p class="msg '+FM.note.type+'" role="status">'+esc(FM.note.text)+'</p>';
  h+='<p class="muted" style="margin:0 0 14px">'+esc(r.business_name||"-")+' · '+esc(r.work_type)+' · '+esc(r.work_location)+' · <span class="st '+stClass(r.status)+'">'+esc(r.status)+'</span></p>';
  h+='<div class="fgrid"><section class="fbox"><h3>موعد المتابعة</h3><div class="acts"><input class="in" type="date" id="fuDate" value="'+esc(r.follow_up_date||"")+'" style="width:auto"><button class="btn sm primary" type="button" data-m="fu">حفظ</button><button class="btn sm" type="button" data-m="fuclear">مسح الموعد</button></div></section>';
  if(ceo){
    h+='<section class="fbox"><h3>الماليات</h3><div class="acts" style="margin-bottom:10px"><label class="muted" for="fmVal">قيمة الطلب (جنيه)</label><input class="in" type="number" min="0" id="fmVal" value="'+v+'" style="width:140px"><button class="btn sm primary" type="button" data-m="val">حفظ القيمة</button></div>'+
      '<div class="summary-bar" style="margin:0 0 10px"><span>المحصّل: <strong>'+num(c)+'</strong></span><span class="sep"></span><span>المتبقي: <strong>'+num(v-c)+'</strong></span></div>'+
      '<div class="scroll" style="max-height:170px;margin-bottom:10px"><table style="min-width:340px"><thead><tr><th>التاريخ</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr></thead><tbody>'+
      (FM.pays.length?FM.pays.map(function(p){return '<tr><td>'+esc(p.paid_at)+'</td><td>'+num(p.amount)+'</td><td>'+esc(p.note||"-")+'</td><td><button class="btn no sm" type="button" data-m="pdel" data-pid="'+p.id+'">حذف</button></td></tr>';}).join(""):'<tr><td colspan="4" class="muted">مفيش دفعات لسه.</td></tr>')+

/* ---------- Appointments calendar ---------- */
var CONSULT="حجز استشارة مجانية",SLOTS=["صباحًا (10 – 12)","ظهرًا (12 – 3)","مساءً (3 – 6)","مساءً متأخر (6 – 9)"];
var DOWS=["سبت","أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة"],DOW=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"],MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function pad2(n){return ("0"+n).slice(-2);}
function ymd(y,m,d){return y+"-"+pad2(m+1)+"-"+pad2(d);}
function addDays(ds,n){var p=ds.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return dayStr(d);}
function dowName(ds){var p=ds.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return DOW[(d.getDay()+1)%7];}
function calEvents(){
  var m={};
  S.requests.forEach(function(r){
    if(!r.follow_up_date)return;
    var isC=r.work_type===CONSULT,slot="",topic="",asked="",note="",det=String(r.details||"");
    if(isC){
      var a=/الميعاد المفضل:\s*(\d{4}-\d{2}-\d{2})\s*—\s*([^\n]+)/.exec(det);if(a){asked=a[1];slot=a[2].trim();}
      var t=/(?:^|\n)الموضوع:\s*([^\n]+)/.exec(det);if(t)topic=t[1].trim();
      note=det.split("\n").filter(function(l){return l.indexOf("الميعاد المفضل:")!==0&&l.indexOf("الموضوع:")!==0;}).join("\n").trim();
    }
    (m[r.follow_up_date]=m[r.follow_up_date]||[]).push({r:r,c:isC,slot:slot,topic:topic,asked:asked,note:note,closed:r.status==="مكتمل"||r.status==="مرفوض"});
  });
  Object.keys(m).forEach(function(k){m[k].sort(function(x,y){
    if(x.closed!==y.closed)return x.closed?1:-1;
    if(x.c!==y.c)return x.c?-1:1;
    var sx=SLOTS.indexOf(x.slot),sy=SLOTS.indexOf(y.slot);sx=sx<0?9:sx;sy=sy<0?9:sy;
    return sx-sy||x.r.id-y.r.id;});});
  return m;
}

function calView(){
  var ceo=S.profile.role==="ceo",today=dayStr(new Date()),ev=calEvents();

  var cm=S.cm||S.cd.slice(0,7),py=+cm.slice(0,4),pm=+cm.slice(5,7)-1;
  var first=new Date(py,pm,1),lead=(first.getDay()+1)%7,dim=new Date(py,pm+1,0).getDate();
  var prev=new Date(py,pm-1,1),next=new Date(py,pm+1,1);

  function open(k){return (ev[k]||[]).filter(function(x){return !x.closed;});}
  function cnt(k,c){return open(k).filter(function(x){return x.c===c;}).length;}

  var od=0;Object.keys(ev).forEach(function(k){if(k<today)ev[k].forEach(function(x){if(x.c&&(x.r.status==="جديد"||x.r.status==="قيد التواصل"))od++;});});

  h+='<section class="card cal"><div class="cal-h"><button class="btn sm" type="button" data-act="calnav" data-m="'+pk+'" aria-label="الشهر اللي قبله">→</button><b>'+MONTHS[pm]+' '+py+'</b><button class="btn sm" type="button" data-act="calnav" data-m="'+nk+'" aria-label="الشهر اللي بعده">←</button><button class="btn sm primary" type="button" data-act="caltoday">النهارده</button></div><div class="cal-g">';
  DOWS.forEach(function(n){h+='<i class="cal-w">'+n+'</i>';});
  for(i=0;i<lead;i++)h+='<span class="cal-e"></span>';

    var k=ymd(py,pm,i),c=cnt(k,true),f=cnt(k,false);
    h+='<button type="button" class="cal-d'+(k===today?" td":"")+(k===S.cd?" sel":"")+'" data-act="calday" data-d="'+k+'" aria-label="'+i+' '+MONTHS[pm]+(c?"، "+c+" استشارة":"")+'" aria-pressed="'+(k===S.cd)+'"><b>'+i+'</b>'+((c||f)?'<span class="cal-b">'+(c?'<em class="c1">'+c+'</em>':'')+(f?'<em class="c2">'+f+'</em>':'')+'</span>':'')+'</button>';
  }
  h+='</div><p class="muted cal-k"><em class="c1">●</em> استشارة محجوزة &nbsp; <em class="c2">●</em> متابعة</p></section>';
  var L=ev[S.cd]||[];
  h+='<h2 class="cal-t">'+dowName(S.cd)+' '+(+S.cd.slice(8,10))+' '+MONTHS[+S.cd.slice(5,7)-1]+(S.cd===today?" (النهارده)":"")+'</h2><div class="rcards2">';
  if(!L.length)h+='<p class="muted">مفيش مواعيد في اليوم ده.</p>';
  L.forEach(function(e){h+=calCard(e,ceo);});
  h+='</div>';
  var late=[];Object.keys(ev).sort().forEach(function(k){if(k<today)ev[k].forEach(function(x){if(x.c&&(x.r.status==="جديد"||x.r.status==="قيد التواصل"))late.push({k:k,e:x});});});
  if(late.length){
    h+='<h2 class="cal-t">حجوزات فاتت من غير متابعة</h2><div class="rcards2">';
    late.forEach(function(x){h+='<div class="late"><span class="muted" dir="ltr">'+esc(x.k)+'</span>'+calCard(x.e,ceo)+'</div>';});

  }
  return h;

    h+='<tr><td><div class="nm"><input class="in" id="nm'+esc(u.id)+'" value="'+esc(u.full_name||"")+'" placeholder="الاسم" aria-label="الاسم"><button class="btn sm" type="button" data-act="nm" data-id="'+esc(u.id)+'">حفظ</button></div></td><td dir="ltr" style="text-align:right">'+esc(u.email)+'<div class="muted" style="font-size:12px;direction:rtl">'+(u.last_sign_in?'آخر دخول: '+esc(new Date(u.last_sign_in).toLocaleString("en-GB")):'لم يسجّل دخول بعد')+'</div></td><td>'+esc(POS[u.role]||"قيد الانتظار")+'</td><td><span class="st '+(u.status==="active"?"done":u.status==="pending"?"new":"bad")+'">'+esc({active:"نشط",pending:"قيد الانتظار",rejected:"مرفوض",disabled:"موقوف"}[u.status]||u.status)+'</span></td><td>';
    if(!isC&&u.status==="active")h+='<div class="acts"><select class="in" data-f="role" data-id="'+esc(u.id)+'" aria-label="تغيير الوظيفة" style="min-width:150px"><option value="manager"'+(u.role==="manager"?" selected":"")+'>Manager</option><option value="assistant_manager"'+(u.role==="assistant_manager"?" selected":"")+'>Assistant Manager</option></select><button class="btn no sm" type="button" data-act="usr" data-id="'+esc(u.id)+'" data-v="disable">إيقاف</button></div>';
    else if(!isC&&(u.status==="disabled"||u.status==="rejected"&&u.role!=="pending"))h+='<button class="btn sm" type="button" data-act="usr" data-id="'+esc(u.id)+'" data-v="activate">تفعيل</button>';
    else h+='<span class="muted">-</span>';
    if(!isC)h+='<div class="acts" style="margin-top:8px"><button class="btn sm" type="button" data-act="pw" data-id="'+esc(u.id)+'">🔑 كلمة سر</button>'+(u.status==="active"?'<button class="btn sm" type="button" data-act="ent" data-id="'+esc(u.id)+'">↪ دخول كموظف</button>':'')+'<button class="btn no sm" type="button" data-act="udel" data-id="'+esc(u.id)+'" data-n="'+esc(u.full_name||u.email)+'">🗑 حذف</button></div>';
    h+='</td></tr>';
  });
  return h+'</tbody></table></div>';
}

function jobsView(){return toolbarView("job")+'<div id="tbl">'+jobTable()+'</div>';}
function jobTable(){
  var L=jobFiltered(),h='<p class="muted" style="margin:0 0 8px;font-size:15px">'+L.length+' من '+S.jobapps.length+' طلب</p>';
  if(L.length){
    var byJob={},bySt={},avgY=0;
    L.forEach(function(j){byJob[j.desired_job||"أخرى"]=(byJob[j.desired_job||"أخرى"]||0)+1;bySt[j.status]=(bySt[j.status]||0)+1;avgY+=Number(j.years_experience||0);});
    if(L.length)avgY=Math.round((avgY/L.length)*10)/10;
    var topJob=Object.keys(byJob).sort(function(a,b){return byJob[b]-byJob[a];})[0]||"-";
    h+='<div class="summary-bar"><span>أكثر وظيفة مطلوبة: <strong>'+esc(topJob)+'</strong> ('+(byJob[topJob]||0)+')</span><span class="sep"></span><span>متوسط الخبرة: <strong>'+avgY+'</strong> سنة</span><span class="sep"></span><span>جديد: <strong>'+(bySt["جديد"]||0)+'</strong></span><span class="sep"></span><span>مقبول للترشيح: <strong>'+(bySt["مقبول للترشيح"]||0)+'</strong></span></div>';
  }
  h+='<div class="scroll" style="margin-top:12px"><table style="min-width:900px"><thead><tr><th>#</th><th>الاسم</th><th>التليفون</th><th>الإيميل</th><th>المحافظة</th><th>الوظيفة</th><th>الخبرة</th><th>آخر مكان</th><th>معلومات إضافية</th><th>التاريخ</th><th>الحالة</th><th>CV</th><th></th></tr></thead><tbody>';
  if(!L.length)h+='<tr><td colspan="13" class="muted">'+(S.jobapps.length?"مفيش طلبات مطابقة للبحث.":"مفيش طلبات توظيف لسه.")+'</td></tr>';
  L.forEach(function(j){
    var d=j.created_at?new Date(j.created_at).toLocaleDateString("en-GB"):"-";
    h+='<tr><td>'+j.id+'</td><td>'+esc(j.full_name)+'</td><td dir="ltr" style="text-align:right">'+esc(j.phone)+' <a class="wl" href="'+waLink(j.phone)+'" target="_blank" rel="noopener" title="واتساب" aria-label="واتساب">💬</a></td><td dir="ltr" style="text-align:right">'+esc(j.email||"-")+'</td><td>'+esc(j.governorate)+'</td><td>'+esc(j.desired_job)+'</td><td>'+esc(j.years_experience)+' سنة</td><td>'+esc(j.last_workplace||"-")+'</td><td style="min-width:180px;white-space:normal">'+esc(j.details||"-")+'</td><td>'+esc(d)+'</td>'+
      '<td><select class="in" data-f="jobstatus" data-id="'+j.id+'" aria-label="الحالة">'+opts(JOB_STATUSES.indexOf(j.status)<0?JOB_STATUSES.concat([j.status]):JOB_STATUSES,j.status)+'</select></td><td>'+(j.cv_path?'<button class="btn sm" type="button" data-act="cv" data-p="'+esc(j.cv_path)+'">📎 CV</button>':'<span class="muted">-</span>')+'</td><td><button class="btn no sm" type="button" data-act="del" data-k="job" data-id="'+j.id+'">🗑</button></td></tr>';
  });
  return h+'</tbody></table></div>';
}

function permsView(){
  var P=[["تحليل التشغيل بالكامل",1,0,0],["قبول أو رفض طلبات دخول الموظفين",1,0,0],["قبول أو رفض طلبات العملاء",1,0,0],["القيمة والتحصيل (الماليات)",1,0,0],["استقبال الطلب وجمع بيانات العميل",1,1,0],["توزيع الشغل على الموظفين",1,1,0],["رؤية موقع العمل ونوعه",1,1,1],["رؤية بيانات العميل",1,1,0],["رؤية بيانات الباحثين عن عمل وملفات الـ CV",1,0,0],["إدارة الموظفين (كلمة سر، حذف، دخول بحسابهم)",1,0,0],["تصدير Excel كامل بالماليات",1,0,0],["اشتراكات حاسبة التكلفة (تفعيل وأكواد)",1,0,0],["النسخ الاحتياطي الخارجي",1,0,0],["تصدير Excel للطلبات (بدون ماليات)",1,1,0],["تصدير Excel للمهام المسندة له فقط",0,0,1]];
  var h='<div class="scroll"><table style="min-width:520px"><thead><tr><th>الصلاحية</th><th>CEO</th><th>Manager</th><th>Assistant Manager</th></tr></thead><tbody>';
  P.forEach(function(p){h+='<tr><td>'+p[0]+'</td>'+[1,2,3].map(function(i){return '<td>'+(p[i]?'<span class="yes">مسموح</span>':'<span class="nope">غير مسموح</span>')+'</td>';}).join("")+'</tr>';});
  return h+'</tbody></table></div>';
}

function workView(){
  var h='<div class="xp" style="margin-bottom:12px"><button class="btn sm primary" type="button" data-act="xls">⬇ تصدير مهامي Excel</button></div><div class="scroll"><table style="min-width:420px"><thead><tr><th>موقع العمل</th><th>نوع العمل</th></tr></thead><tbody>';
  if(!S.tasks.length)h+='<tr><td colspan="2" class="muted">لا يوجد شغل متوزّع عليك لسه.</td></tr>';
  S.tasks.forEach(function(t){h+='<tr><td>'+esc(t.work_location)+'</td><td>'+esc(t.work_type)+'</td></tr>';});
  return h+'</tbody></table></div>';
}

function appView(){
  var b="",role=S.profile.role;
  switch(S.tab){case "analytics":b=analyticsView();break;case "requests":b=requestsView();break;case "calendar":b=calView();break;case "access":b=accessView();break;case "perms":b=permsView();break;case "jobs":b=jobsView();break;case "activity":b=activityView();break;case "trash":b=trashView();break;case "tools":b=toolsView();break;case "backup":b=backupView();break;case "work":b=workView();break;}
  var intro=role==="ceo"?['مركز قيادة Fnbora','نظرة شاملة على الطلبات والتشغيل والموظفين.']:role==="manager"?['إدارة الطلبات والتشغيل','استقبل الطلبات، راجع التفاصيل، ووزّع المهام وتابع التنفيذ.']:['مهامي الميدانية','هنا تظهر لك مواقع العمل وأنواع المهام المسندة إليك فقط.'];
  var today=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  return '<div class="wrap">'+topbar()+'<section class="workspace-intro"><div><h1>'+intro[0]+'</h1><p>'+intro[1]+'</p></div><div class="workspace-date">'+esc(today)+'</div></section>'+impBar()+alertView()+tabsView()+msgView()+b+'</div>';
}

function render(){
  var el=document.getElementById("app"),h;
  if(!S.booted)h='<div class="center"><p class="muted">جاري التحميل...</p></div>';
  else if(!S.session)h=authView();
  else if(!S.profile)h='<div class="center"><div class="card">'+msgView()+'<p class="muted">جاري تحميل الحساب...</p><button class="btn no" data-act="logout" type="button">تسجيل الخروج</button></div></div>';
  else if(S.profile.status!=="active"||!TABS[S.profile.role])h=holdView();
  else if(S.mfa)h=mfaView();
  else h=appView();
  el.innerHTML=h;
}

/* ---------- Actions ---------- */
function act(p){S.busy=true;setMsg(null);return p.then(function(){return null;},function(e){setMsg("err",arErr(e));}).then(function(){S.busy=false;return S.profile&&S.profile.status==="active"?loadTab():render();});}

var app=document.getElementById("app");

app.addEventListener("submit",function(e){
  e.preventDefault();
  var g=function(id){var x=document.getElementById(id);return x?x.value.trim():"";};
  if(e.target.id==="authForm"){
    var email=g("em"),pw=document.getElementById("pw").value;
    S.busy=true;setMsg(null);render();
    var p;
    if(S.mode==="login")p=sb.auth.signInWithPassword({email:email,password:pw});
    else p=sb.auth.signUp({email:email,password:pw,options:{data:{full_name:g("fn"),requested_role:g("rr")}}});
    p.then(function(r){
      if(r.error)throw r.error;
      S.busy=false;
      if(r.data&&r.data.session){S.session=r.data.session;return loadProfile();}
      setMsg("ok","اتبعت طلبك. لو وصلتك رسالة تأكيد على الإيميل اضغط عليها، وبعدها استنى موافقة الـ CEO.");S.mode="login";render();
    }).catch(function(er){S.busy=false;setMsg("err",arErr(er));render();});
  }
  if(e.target.id==="mfaForm"&&S.mfa){
    var code=g("mc").replace(/[^0-9]/g,"");
    if(code.length!==6){setMsg("err","اكتب الكود المكوّن من 6 أرقام.");render();return;}
    S.busy=true;setMsg(null);render();
    sb.auth.mfa.challengeAndVerify({factorId:S.mfa.factorId,code:code}).then(function(r){
      if(r.error)throw r.error;
      return sb.auth.getSession();
    }).then(function(r){
      S.session=r.data.session;S.mfa=null;S.busy=false;return loadProfile();
    }).catch(function(){S.busy=false;setMsg("err","الكود غلط أو انتهى. اكتب كود جديد من التطبيق.");render();});
    return;
  }
  if(e.target.id==="addForm"){
    act(rpc("submit_customer_request",{p_customer_name:g("a1"),p_phone:g("a2"),p_business_name:g("a3"),p_work_type:g("a4"),p_work_location:g("a5"),p_details:g("a6")}).then(function(){setMsg("ok","تمت إضافة الطلب.");}));
  }
});

app.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act"),id=t.getAttribute("data-id");
  if(a==="mode"){S.mode=t.getAttribute("data-m");setMsg(null);render();}
  if(a==="logout"){try{sessionStorage.removeItem(IMP_KEY);}catch(er){}sb.auth.signOut().then(function(){S.session=null;S.profile=null;S.tab=null;setMsg(null);render();});}
  if(a==="refresh"){setMsg(null);loadProfile();}
  if(a==="tab"){S.tab=t.getAttribute("data-tab");setMsg(null);loadTab();}
  if(a==="rev"){
    var ok=t.getAttribute("data-v")==="1",role=document.getElementById("pr"+id).value;
    act(rpc("ceo_review_access_request",{p_user_id:id,p_approved:ok,p_role:role}).then(function(){setMsg("ok",ok?"تم قبول الحساب.":"تم رفض الطلب.");}));
  }
  if(a==="fs"){if(t.getAttribute("data-k")==="req")S.fs=t.getAttribute("data-v");else S.jfs=t.getAttribute("data-v");render();}
  if(a==="calday"){S.cd=t.getAttribute("data-d");render();return;}
  if(a==="calnav"){S.cm=t.getAttribute("data-m");render();return;}
  if(a==="caltoday"){S.cm=null;S.cd=null;render();return;}
  if(a==="xls")exportExcel();
  if(a==="file")openFile(+id);
  if(a==="alertgo"){var tg=S.alert?S.alert.tab:"requests";S.alert=null;setTitle(0);S.tab=tg;loadTab();}
  if(a==="alertx"){S.alert=null;render();}
  if(a==="notif"){try{Notification.requestPermission().then(function(){render();});}catch(er){}}
  if(a==="trs"||a==="trp"){
    if(a==="trp"&&!window.confirm("مسح نهائي؟ مش هتقدر ترجّعه."))return;
    var cvp=null;
    if(a==="trp"&&t.getAttribute("data-k")==="job"){var it=S.trash.filter(function(x){return x.kind==="job"&&x.id===+id;})[0];cvp=it&&it.cv_path;}
    act(Promise.resolve(cvp?sb.storage.from("cvs").remove([cvp]):null).catch(function(){}).then(function(){return rpc(a==="trs"?"ceo_restore_trash":"ceo_purge_trash",{p_kind:t.getAttribute("data-k"),p_id:+id});}).then(function(){setMsg("ok",a==="trs"?"تم الاسترجاع.":"تم المسح النهائي.");}));
  }
  if(a==="card")openCard(+id);
  if(a==="del"){
    var isReq=t.getAttribute("data-k")==="req";
    if(!window.confirm(isReq?"نقل الطلب رقم "+id+" لسلة المهملات؟ تقدر ترجّعه منها.":"نقل طلب التوظيف رقم "+id+" لسلة المهملات؟ تقدر ترجّعه منها."))return;
    act((isReq?rpc("ceo_delete_request",{p_request_id:+id}):rpc("ceo_delete_job_application",{p_id:+id})).then(function(){setMsg("ok","اتنقل لسلة المهملات.");}));
  }
  if(a==="pw"){
    var np=window.prompt("اكتب كلمة السر الجديدة للموظف (6 حروف أو أكتر). بعدها ابعتهاله وهيقدر يدخل بيها.");
    if(np===null)return;
    act(rpc("ceo_set_user_password",{p_user_id:id,p_password:np}).then(function(){setMsg("ok","تم تغيير كلمة السر. الموظف يقدر يدخل بيها دلوقتي.");}));
  }
  if(a==="udel"){
    if(!window.confirm("حذف الموظف "+(t.getAttribute("data-n")||"")+" نهائيًا من قاعدة البيانات؟ حسابه هيتمسح ومش هيقدر يدخل تاني."))return;
    act(rpc("ceo_delete_user",{p_user_id:id}).then(function(){setMsg("ok","تم حذف الموظف.");}));
  }
  if(a==="ent")enterAs(id);
  if(a==="back")backToCeo();
  if(a==="cv")openCv(t.getAttribute("data-p"));
  if(a==="nm")act(rpc("ceo_set_user_name",{p_user_id:id,p_name:document.getElementById("nm"+id).value}).then(function(){setMsg("ok","تم حفظ الاسم.");}));
  if(a==="usr")act(rpc("ceo_manage_user",{p_user_id:id,p_action:t.getAttribute("data-v")}));
});

app.addEventListener("input",function(e){
  var el=e.target;if(el.id!=="srch")return;
  var k=el.getAttribute("data-k"),box=document.getElementById("tbl");
  if(k==="req"){S.q=el.value;if(box)box.innerHTML=reqTable();}else{S.jq=el.value;if(box)box.innerHTML=jobTable();}
});

app.addEventListener("change",function(e){
  var el=e.target,f=el.getAttribute("data-f");if(!f)return;
  if(f==="xr"){S.xr=el.value;render();return;}
  if(f==="xf"){S.xf=el.value;return;}
  if(f==="xt"){S.xt=el.value;return;}
  var id=el.getAttribute("data-id");
  if(f==="status")act(rpc("manager_update_request_status",{p_request_id:+id,p_status:el.value}));
  if(f==="jobstatus")act(rpc("ceo_update_job_application_status",{p_id:+id,p_status:el.value}).then(function(){setMsg("ok","تم تحديث حالة الطلب.");}));
  if(f==="progress")act(rpc("manager_update_request_progress",{p_request_id:+id,p_progress:Math.round(Number(el.value))}));
  if(f==="assign"&&el.value)act(rpc("manager_assign_task",{p_request_id:+id,p_assistant_user_id:el.value}).then(function(){setMsg("ok","تم توزيع الشغل.");}));
  if(f==="role")act(rpc("ceo_manage_user",{p_user_id:id,p_action:"change_role",p_role:el.value}));
});

/* ---------- Boot ---------- */
function boot(){
  if(!window.supabase){S.booted=true;setMsg("err","تعذّر تحميل مكتبة الدخول. اتأكد من النت وحدّث الصفحة.");render();return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.getSession().then(function(r){
    S.booted=true;S.session=r.data.session;
    if(S.session)return loadProfile();
    render();
  }).catch(function(e){S.booted=true;setMsg("err",arErr(e));render();});
}
render();boot();
})();
</script>
</body>
</html>
